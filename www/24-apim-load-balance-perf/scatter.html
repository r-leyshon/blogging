    const colours = {
      'Baseline': '#1f7a8c',
      'Direct (no APIM)': '#5c6b73',
      'Client retry': '#e09f3e',
      'APIM retry': '#2a9d8f',
      'Combined': '#bc4749',
      'Sustained': '#264653',

    const landmarks = new Set([
      'apim_retry_asym',
      'retry_after_header',
      'full_resilience',
      'baseline',
      'sustained_apim_asym',
      'circuit_breaker',
      'optimal_combined',
      'asym_retry_cb_5xx',
      'sustained_cb_only',
      'sustained_baseline',
    ]);
    const phaseOrder = [
      'Baseline',
      'Direct (no APIM)',
      'Client retry',
      'APIM retry',
      'Combined',
      'Sustained',
    ];

    function isoTraces() {
      const levels = [
        { g: 1, dash: 'dot' },
        { g: 10, dash: 'dash' },
        { g: 50, dash: 'dash' },
        { g: 100, dash: 'solid' },
        { g: 150, dash: 'solid' },
      ];
      return levels.map(({ g, dash }) => {
        const x = [];
        const y = [];
        for (let s = 2; s <= 100; s += 2) {
          const thr = g / (s / 100);
          if (thr <= 260) {
            x.push(s);
            y.push(thr);
          }
        }
        return {
          type: 'scatter',
          mode: 'lines',
          x,
          y,
          name: `goodput ≈ ${g}/s`,
          line: { color: 'rgba(90,90,90,0.45)', width: 2, dash },
          showlegend: false,
          hovertemplate: 'goodput = ' + g + '/s<extra></extra>',
        };
      });
    }

    function pointTraces(runs) {
      return phaseOrder
        .map((phase) => {
          const pts = runs.filter((r) => r.phase === phase);
          if (!pts.length) return null;
          return {
            type: 'scatter',
            mode: 'markers+text',
            name: phase,
            x: pts.map((r) => r.success_rate_pct),
            y: pts.map((r) => r.throughput_rps),
            text: pts.map(() => ''),
            marker: {
              size: 12,
              color: colours[phase],
              line: { width: 1, color: '#fff' },
            },
            customdata: pts.map((r) => [
              r.run_id,
              r.goodput_rps,
              r.config,
              r.load,
              r.tts_p50_ms == null ? 'n/a' : r.tts_p50_ms,
            ]),
            hovertemplate:
              '<b>%{customdata[0]}</b><br>' +
              'Success rate: %{x:.1f}%<br>' +
              'Throughput: %{y:.2f} req/s<br>' +
              'Goodput: %{customdata[1]:.2f} succ/s<br>' +
              'Load: %{customdata[3]}<br>' +
              'TTS p50: %{customdata[4]} ms<br><br>' +
              '%{customdata[2]}' +
              '<extra></extra>',
          };
        })
        .filter(Boolean);
    }

    function draw() {
      if (typeof Plotly === 'undefined') {
        document.getElementById('chart').innerHTML =
          '<p class="err">Plotly failed to load (needs network). Use quarto preview or a local server.</p>';
        return;
      }
      const el = document.getElementById('chart');
      const w = Math.max(320, el.clientWidth || 900);
      Plotly.newPlot(
        el,
        [...isoTraces(), ...pointTraces(DATA.runs)],
        {
          title: { text: 'APIM experiments: throughput vs success rate', font: { size: 16 } },
          xaxis: { title: 'Success rate (%)', range: [-2, 105] },
          yaxis: { title: 'Throughput (original req/s)', range: [-5, 260] },
            legend: { orientation: 'h', yanchor: 'top', y: -0.18, x: 0 },
            margin: { l: 64, r: 24, t: 64, b: 110 },
          hovermode: 'closest',
          width: w,
          height: 640,
        },
        {
          responsive: false,
          displayModeBar: true,
          staticPlot: false,
        }
      );
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', draw);
    } else {
      draw();
    }
