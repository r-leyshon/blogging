  </style>
</head>

    const colours = {
      'No retry': '#1f7a8c',
      'Direct (no gateway)': '#5c6b73',
      'Client retry': '#e09f3e',
      'Pool retry': '#2a9d8f',
      'Stacked retries': '#bc4749',
      'Quota to spare': '#8e7dbe',
    };
    const groupLabels = {
      'Quota to spare': 'Quota to spare (60,000 TPM)',
    };
    const symbols = { 'Quota to spare': 'diamond' };
    const phaseOrder = [
      'No retry',
      'Direct (no gateway)',
      'Client retry',
      'Pool retry',
      'Stacked retries',
      'Quota to spare',
    ];
    const Y_MIN = 0.3;
    const Y_MAX = 400;

    const isoLevels = [
      { g: 0.5, dash: 'dot' },
      { g: 2, dash: 'dot' },
      { g: 10, dash: 'dash' },
      { g: 30, dash: 'solid' },
    ];

    function isoTraces() {
      const lines = isoLevels.map(({ g, dash }) => {
        const x = [];
        const y = [];
        for (let s = 1; s <= 100; s += 1) {
          const thr = g / (s / 100);
          if (thr <= Y_MAX) {
            x.push(s);
            y.push(thr);
          }
        }
        return {
          type: 'scatter',
          mode: 'lines',
          x,
          y,
          name: `goodput = ${g}/s`,
          line: { color: 'rgba(90,90,90,0.45)', width: 2, dash },
          showlegend: false,
          hovertemplate: 'goodput = ' + g + '/s<extra></extra>',
        };
      });
      const labels = {
        type: 'scatter',
        mode: 'text',
        x: isoLevels.map(() => 55),
        y: isoLevels.map((l) => (l.g / 0.55) * 1.1),
        text: isoLevels.map((l) => `${l.g}/s`),
        textposition: 'top right',
        textfont: { size: 11, color: 'rgba(70,70,70,0.9)' },
        showlegend: false,
        hoverinfo: 'skip',
      };
      return [...lines, labels];
    }

    function pointTraces(runs) {
      return phaseOrder
        .map((phase) => {
          const pts = runs.filter((r) => r.group === phase);
          if (!pts.length) return null;
          return {
            type: 'scatter',
            mode: 'markers',
            name: groupLabels[phase] || phase,
            x: pts.map((r) => r.success_rate_pct),
            y: pts.map((r) => Math.max(r.throughput_rps, Y_MIN)),
            marker: {
              size: 12,
              symbol: symbols[phase] || 'circle',
              color: colours[phase],
              line: { width: 1, color: '#fff' },
            },
            customdata: pts.map((r) => [
              r.label,
              r.run_id,
              `${r.successes} of ${r.iterations}`,
              r.throughput_rps,
              r.goodput_rps,
            ]),
            hoverlabel: { align: 'left' },
            hovertemplate:
              '<b>%{customdata[0]}</b><br>' +
              '%{customdata[1]}<br>' +
              '%{x:.1f}% success (%{customdata[2]})<br>' +
              '%{customdata[3]:.2f}/s throughput, %{customdata[4]:.2f}/s goodput' +
              '<extra></extra>',
          };
        })
        .filter(Boolean);
    }

    function draw() {
      if (typeof Plotly === 'undefined') {
        document.getElementById('chart').innerHTML =
          '<p class="err">Plotly failed to load (needs network). Use quarto preview or a local server.</p>';
        return;
      }
      const el = document.getElementById('chart');
      const w = Math.max(320, el.clientWidth || 900);
      Plotly.newPlot(
        el,
        [...isoTraces(), ...pointTraces(DATA.runs)],
        {
          title: { text: 'The 200-request bursts: throughput vs success rate', font: { size: 16 } },
          xaxis: { title: 'Success rate (%)', range: [-2, 106] },
          yaxis: {
            title: 'Throughput (original requests per second, log scale)',
            type: 'log',
            range: [Math.log10(Y_MIN), Math.log10(Y_MAX)],
            tickvals: [0.5, 1, 2, 5, 10, 20, 50, 100, 200],
            ticktext: ['0.5', '1', '2', '5', '10', '20', '50', '100', '200'],
          },
          legend: { orientation: 'h', yanchor: 'top', y: -0.18, x: 0 },
          margin: { l: 64, r: 24, t: 64, b: 110 },
          hovermode: 'closest',
          width: w,
          height: 640,
        },
        {
          responsive: false,
          displayModeBar: true,
          staticPlot: false,
        }
      );
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', draw);
    } else {
      draw();
    }
  </script>
