      { g: 30, dash: 'solid' },
    ];

    function isoTraces(levels = isoLevels, yMax = Y_MAX, labelX = 55, yMin = Y_MIN) {
      const lines = levels.map(({ g, dash }) => {
        const x = [];
        const y = [];
        for (let s = 1; s <= 100; s += 1) {
          const thr = g / (s / 100);
          if (thr <= yMax) {
            x.push(s);
            y.push(thr);
          }
        }
        return {
          type: 'scatter',
          mode: 'lines',
          x,
          y,
          name: `goodput = ${g}/s`,
          line: { color: 'rgba(90,90,90,0.45)', width: 2, dash },
          showlegend: false,
          hovertemplate: 'goodput = ' + g + '/s<extra></extra>',
        };
      });
      const shown = levels.filter((l) => {
        const y = (l.g / (labelX / 100)) * 1.1;
        return y >= yMin && y <= yMax;
      });
      const labels = {
        type: 'scatter',
        mode: 'text',
        x: shown.map(() => labelX),
        y: shown.map((l) => (l.g / (labelX / 100)) * 1.1),
        text: shown.map((l) => `${l.g}/s`),
        textposition: 'top right',
        textfont: { size: 11, color: 'rgba(70,70,70,0.9)' },
        showlegend: false,
        hoverinfo: 'skip',
      };
      return [...lines, labels];
    }

    function pointTraces(runs) {
      return phaseOrder
        .map((phase) => {
          const pts = runs.filter((r) => r.group === phase);
          if (!pts.length) return null;
          return {
            type: 'scatter',
            mode: 'markers',
            name: groupLabels[phase] || phase,
            x: pts.map((r) => r.success_rate_pct),
            y: pts.map((r) => Math.max(r.throughput_rps, Y_MIN)),
            marker: {
              size: 12,
              symbol: symbols[phase] || 'circle',
              color: colours[phase],
              line: { width: 1, color: '#fff' },
            },
            customdata: pts.map((r) => [
              r.label,
              r.run_id,
              `${r.successes} of ${r.iterations}`,
              r.throughput_rps,
              r.goodput_rps,
            ]),
            hoverlabel: { align: 'left' },
            hovertemplate:
              '<b>%{customdata[0]}</b><br>' +
              '%{customdata[1]}<br>' +
              '%{x:.1f}% success (%{customdata[2]})<br>' +
              '%{customdata[3]:.2f}/s throughput, %{customdata[4]:.2f}/s goodput' +
              '<extra></extra>',
          };
        })
        .filter(Boolean);
    }

    function burstView() {
      return {
        traces: [...isoTraces(), ...pointTraces(DATA.runs)],
        layout: {
          title: { text: 'Every region short, bursts: throughput vs success rate', font: { size: 16 } },
          xaxis: { title: 'Success rate (%)', range: [-2, 106] },
          yaxis: {
            title: 'Throughput (original requests per second, log scale)',
            type: 'log',
            range: [Math.log10(Y_MIN), Math.log10(Y_MAX)],
            tickvals: [0.5, 1, 2, 5, 10, 20, 50, 100, 200],
            ticktext: ['0.5', '1', '2', '5', '10', '20', '50', '100', '200'],
          },
          legend: { orientation: 'h', yanchor: 'top', y: -0.18, x: 0 },
          margin: { l: 64, r: 24, t: 64, b: 110 },
        },
      };
    }

    // ---------- Legend filters ----------
    // Legend entries carry a key (trace.meta.key). Clicking one toggles that key in `hidden`,
    // and the chart is rebuilt: colour entries hide a series or region, shape entries hide
    // gateway/client or an experiment type, and the hollow entry hides the 3-a-second runs.
    const hidden = new Set();
    const GREY_MARK = '#7a858c';
    const ms = (v) => Math.round(v).toLocaleString('en-GB') + ' ms';

    function dummy(name, symbol, line, key) {
      return {
        type: 'scatter', mode: 'markers', x: [null], y: [null], name, meta: { key },
        visible: hidden.has(key) ? 'legendonly' : true,
        marker: { size: 11, symbol, color: line ? 'rgba(255,255,255,0)' : GREY_MARK, line: { width: 2, color: GREY_MARK } },
        hoverinfo: 'skip',
      };
    }

    // Dots at exactly 100% would hide each other, so nudge them sideways a little (hover shows the true value).
    function nudge(id) {
      let h = 0;
      for (let i = 0; i < id.length; i += 1) h = (h * 31 + id.charCodeAt(i)) % 997;
      return ((h % 21) - 10) / 10 * 1.3;
    }

    function steadyHover(p) {
      return '<b>' + p.title + '</b><br>' + p.run_id + '<br>' + p.rate + ' requests a second<br>' +
        p.success_rate_pct.toFixed(1) + '% success (' + p.successes + ' of ' + p.iterations + ')<br>' +
        p.throughput_rps.toFixed(2) + '/s throughput, ' + p.goodput_rps.toFixed(2) + '/s goodput<br>' +
        'median ' + ms(p.median_ms) + ', p95 ' + ms(p.p95_ms) +
        (p.calls_per_request ? '<br>' + p.calls_per_request.toFixed(2) + ' model calls per request' : '') +
        '<extra></extra>';
    }

    function steadyTraces(view, xKey, hollowAtRate, yKey) {
      const all = DATA.steady.filter((p) => p.view === view);
      const order = [];
      all.forEach((p) => { if (!order.includes(p.series)) order.push(p.series); });
      return order.map((name) => {
        const key = 'series:' + name;
        const mine = all.filter((p) => p.series === name && !hidden.has('side:' + p.side) &&
          !(hollowAtRate && hidden.has('rate:' + p.rate)));
        const colour = all.find((p) => p.series === name).colour;
        return {
          type: 'scatter', mode: 'markers', name, meta: { key },
          visible: hidden.has(key) ? 'legendonly' : true,
          x: mine.map((p) => p[xKey] + (xKey === 'success_rate_pct' && p[xKey] >= 99.5 ? nudge(p.run_id) : 0)),
          y: mine.map((p) => (yKey ? p[yKey] : p.p95_ms)),
          marker: {
            opacity: 0.8,
            size: 12,
            symbol: mine.map((p) => (p.side === 'client' ? 'diamond' : 'circle')),
            color: mine.map((p) => (hollowAtRate && p.rate === hollowAtRate ? 'rgba(255,255,255,0)' : colour)),
            line: { width: 2, color: colour },
          },
          text: mine.map(steadyHover),
          hovertemplate: '%{text}',
          hoverlabel: { align: 'left' },
        };
      });
    }

    const THR_TITLE = 'Throughput (original requests per second, log scale)';
    const levels = (gs) => gs.map((g, k) => ({ g, dash: ['dot', 'dot', 'dash', 'solid'][Math.min(k, 3)] }));

    function mainView() {
      const yMin = 1, yMax = 5;
      return {
        traces: [
          ...isoTraces(levels([1, 1.5, 2, 3]), yMax, 75, yMin),
          ...steadyTraces('main', 'success_rate_pct', 3, 'throughput_rps'),
          dummy('Gateway', 'circle', false, 'side:gateway'),
          dummy('Client, no gateway', 'diamond', false, 'side:client'),
          dummy('Hollow: 3 requests a second (filled: 2)', 'circle', true, 'rate:3'),
        ],
        layout: {
          title: { text: 'Main region short: throughput vs success rate', font: { size: 16 } },
          xaxis: { title: 'Success rate (%)', range: [60, 104] },
          yaxis: {
            title: THR_TITLE, type: 'log',
            range: [Math.log10(yMin), Math.log10(yMax)],
            tickvals: [1, 1.5, 2, 3, 4, 5], ticktext: ['1', '1.5', '2', '3', '4', '5'],
          },
          legend: { orientation: 'h', yanchor: 'top', y: -0.2, x: 0 },
          margin: { l: 64, r: 24, t: 64, b: 130 },
        },
      };
    }

    function everyView() {
      const yMin = 2, yMax = 12;
      return {
        traces: [
          ...isoTraces(levels([2, 3, 4, 5]), yMax, 52, yMin),
          ...steadyTraces('steady_every', 'success_rate_pct', 0, 'throughput_rps'),
          dummy('Gateway', 'circle', false, 'side:gateway'),
          dummy('Client, no gateway', 'diamond', false, 'side:client'),
        ],
        layout: {
          title: { text: 'Every region short, steady: throughput vs success rate', font: { size: 16 } },
          xaxis: { title: 'Success rate (%)', range: [50, 64] },
          yaxis: {
            title: THR_TITLE, type: 'log',
            range: [Math.log10(yMin), Math.log10(yMax)],
            tickvals: [2, 3, 4, 5, 6, 8, 10, 12], ticktext: ['2', '3', '4', '5', '6', '8', '10', '12'],
          },
          shapes: [{ type: 'line', x0: 60, x1: 60, y0: 0, y1: 1, yref: 'paper',
                     line: { color: 'rgba(90,90,90,0.55)', width: 2, dash: 'dash' } }],
          annotations: [
            { x: 60, y: 1, yref: 'paper', xanchor: 'left', yanchor: 'top', showarrow: false,
              text: ' Quota limit: 60% (3.6 of 6 a second)', font: { size: 12, color: 'rgba(70,70,70,0.9)' } },
          ],
          legend: { orientation: 'h', yanchor: 'top', y: -0.2, x: 0 },
          margin: { l: 64, r: 24, t: 64, b: 130 },
        },
      };
    }

    function healthyView() {
      const yMin = 0.5, yMax = 2;
      return {
        traces: [
          ...isoTraces(levels([0.5, 0.75, 1, 1.5]), yMax, 60, yMin),
          ...steadyTraces('healthy', 'success_rate_pct', 0, 'throughput_rps'),
        ],
        layout: {
          title: { text: 'Nothing wrong: throughput vs success rate', font: { size: 16 } },
          xaxis: { title: 'Success rate (%)', range: [50, 104] },
          yaxis: {
            title: THR_TITLE, type: 'log',
            range: [Math.log10(yMin), Math.log10(yMax)],
            tickvals: [0.5, 0.75, 1, 1.5, 2], ticktext: ['0.5', '0.75', '1', '1.5', '2'],
          },
          legend: { orientation: 'h', yanchor: 'top', y: -0.2, x: 0 },
          margin: { l: 64, r: 24, t: 64, b: 110 },
        },
      };
    }

    // ---------- Region speed: median against p95, one dot per run ----------
    const regionColour = { 'UK South': '#2a9d8f', 'Sweden Central': '#e09f3e', 'West Europe': '#bc4749' };
    const condSymbol = { A: 'diamond', B: 'square', C: 'circle' };
    const condLabel = {
      A: 'Direct, all regions together',
      B: 'Direct, one region at a time',
      C: 'Through the gateway, pinned to one region',
    };

    function speedView() {
      const traces = Object.keys(regionColour).map((region) => {
        const key = 'region:' + region;
        const mine = DATA.region_speed.filter((p) => p.region === region && !hidden.has('cond:' + p.condition));
        return {
          type: 'scatter', mode: 'markers', name: region, meta: { key },
          visible: hidden.has(key) ? 'legendonly' : true,
          x: mine.map((p) => p.median_ms),
          y: mine.map((p) => p.p95_ms),
          marker: {
            size: 13, color: regionColour[region],
            symbol: mine.map((p) => condSymbol[p.condition]),
            line: { width: 1, color: '#fff' },
          },
          text: mine.map((p) => '<b>' + region + '</b><br>' + condLabel[p.condition] + '<br>' + p.run_id +
            '<br>median ' + ms(p.median_ms) + ', p95 ' + ms(p.p95_ms) + '<br>' + p.samples + ' answers' +
            '<extra></extra>'),
          hovertemplate: '%{text}',
          hoverlabel: { align: 'left' },
        };
      });
      return {
        traces: [
          ...traces,
          dummy('Through the gateway', 'circle', false, 'cond:C'),
          dummy('Direct, all regions together', 'diamond', false, 'cond:A'),
          dummy('Direct, one region at a time', 'square', false, 'cond:B'),
        ],
        layout: {
          title: { text: 'Region speed: median vs p95 answer time', font: { size: 16 } },
          xaxis: { title: 'Median answer time (ms)', range: [200, 850] },
          yaxis: { title: 'p95 answer time (ms)', range: [300, 1350] },
          annotations: [{ x: 200, y: 300, xanchor: 'left', yanchor: 'bottom', showarrow: false,
                          text: 'Best: bottom left', font: { size: 12, color: 'rgba(70,70,70,0.9)' } }],
          legend: { orientation: 'h', yanchor: 'top', y: -0.2, x: 0 },
          margin: { l: 64, r: 24, t: 64, b: 130 },
        },
      };
    }

    const VIEWS = { bursts: burstView, main: mainView, steady_every: everyView, healthy: healthyView, speed: speedView };

    function render(first) {
      const el = document.getElementById('chart');
      const w = Math.max(320, el.clientWidth || 900);
      const v = (VIEWS[VIEW] || burstView)();
      const layout = { hovermode: 'closest', width: w, height: 640, ...v.layout };
      const config = { responsive: false, displayModeBar: true, staticPlot: false };
      if (first) Plotly.newPlot(el, v.traces, layout, config);
      else Plotly.react(el, v.traces, layout, config);
      return el;
    }

    function draw() {
      if (typeof Plotly === 'undefined') {
        document.getElementById('chart').innerHTML =
          '<p class="err">Plotly failed to load (needs network). Use quarto preview or a local server.</p>';
        return;
      }
      const el = render(true);
      // Legend entries with a key filter the points; others keep Plotly's default behaviour.
      el.on('plotly_legendclick', (ev) => {
        const key = ev.data[ev.curveNumber].meta && ev.data[ev.curveNumber].meta.key;
        if (!key) return true;
        if (hidden.has(key)) hidden.delete(key); else hidden.add(key);
        render(false);
        return false;
      });
      el.on('plotly_legenddoubleclick', (ev) => {
        const key = ev.data[ev.curveNumber].meta && ev.data[ev.curveNumber].meta.key;
        if (!key) return true;
        // Double-click shows everything again.
        hidden.clear();
        render(false);
        return false;
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', draw);
    } else {
      draw();
    }
  </script>
</body>
</html>
